name: Deploy KINGMAKER Supabase database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: write

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF repository secret"; exit 1; }

      - uses: actions/checkout@v4

      - name: Configure public Supabase browser key
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys")"
          public_key="$(printf '%s' "$response" | jq -r '[.[] | select(.name == "anon" or .name == "publishable") | .api_key // .key] | map(select(type == "string" and length > 20)) | first // empty')"
          test -n "$public_key" || { echo "::error::Supabase did not return a public anon/publishable key"; exit 1; }
          PUBLIC_SUPABASE_KEY="$public_key" node <<'NODE'
          const fs = require('fs');
          const path = 'mining-config.js';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/supabaseAnonKey: "[^"]*"/, () =>
            'supabaseAnonKey: ' + JSON.stringify(process.env.PUBLIC_SUPABASE_KEY));
          if (!source.includes('supabaseAnonKey: ' + JSON.stringify(process.env.PUBLIC_SUPABASE_KEY))) {
            throw new Error('Could not safely update the public Supabase key setting');
          }
          fs.writeFileSync(path, source);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mining-config.js
          if ! git diff --cached --quiet; then
            git commit -m "Configure public Supabase browser key"
            git push
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.12

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview database changes
        run: supabase db push --dry-run --remote

      - name: Apply reviewed migrations
        run: supabase db push --yes --remote
