name: KINGMAKER quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · game and smart contract tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install project and contract dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Compile ERC-1155 contract
        run: npm run contract:compile
      - name: Run smart contract security behavior tests
        run: npm run contract:test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated game engine tests
        run: npm test
