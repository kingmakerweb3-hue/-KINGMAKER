name: Deploy KINGMAKER Supabase staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deployment:
        description: "Type DEPLOY-STAGING to apply migrations and deploy the wallet verifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kingmaker-supabase-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.event.inputs.confirm_staging_deployment == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Staging must use a separate Supabase project and dedicated credentials.
      # Never fall back to production repository secrets.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: narpyrvmftxnjvorxxgm
    steps:
      - name: Validate staging-only credentials and target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing staging environment secret SUPABASE_STAGING_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing staging environment secret SUPABASE_STAGING_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing staging environment secret SUPABASE_STAGING_PROJECT_REF"; exit 1; }
          if [ "$SUPABASE_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Refusing to deploy: staging project ref matches the production project"
            exit 1
          fi
          if ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Staging project ref has an unexpected format"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.12

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview staging database changes
        run: supabase db push --dry-run --remote

      - name: Apply migrations to staging only
        run: supabase db push --yes --remote

      - name: Deploy wallet verification Edge Function (JWT verification stays enabled)
        run: supabase functions deploy verify-wallet-link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Confirm deployment target without exposing credentials
        run: |
          echo "Staging migration and Edge Function deployment commands completed."
          echo "Mining activation is intentionally not part of this workflow."
