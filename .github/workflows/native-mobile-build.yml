name: KINGMAKER Mining native mobile build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mining.html"
      - "mining.js"
      - "mining-config.js"
      - "mining-foundation.js"
      - "mining-manifest.json"
      - "mining-sw.js"
      - "index.html"
      - "styles.css"
      - "mobile-shell.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/native-mobile-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync
        run: |
          npm run build:mobile
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kingmaker-mining-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project and sync
        run: |
          npm run build:mobile
          npx cap add ios
          npx cap sync ios
      - name: Build iOS simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          zip -r "$GITHUB_WORKSPACE/kingmaker-mining-ios-simulator.zip" build/Build/Products/Debug-iphonesimulator/App.app
          test -s "$GITHUB_WORKSPACE/kingmaker-mining-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kingmaker-ios-simulator
          path: kingmaker-ios-simulator.zip
          if-no-files-found: error
